<!DOCTYPE html>
<html lang="pt-br"> 
<head>  
    <meta charset="UTF-8">
    <title>Atividade 1</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
   
    <h1 class="atv1">
      Atividade 1 - Programação WEB
    </h1>
    <p>Esta é a primeira atividade do curso.</p>  
    <p>Meu nome é Marcos.</p> 
    <img class="foto-perfil" src="perfil.jpg" alt="Foto de Marcos">

    <section>
    <h2>Meus Interesses</h2>
    <ul class="lista-interesses">
        <li>Desenvolvimento Web</li>
        <li>Análise de Dados</li>
        <li>Educação e Ensino</li>
    </ul>
</section>
  
    <header>
        <h1>Fale Conosco</h1>
    </header>
   
    <main>
        <section>
            <h2 class="atv2">
              Formulário de Contato
            </h2>

            <form>
                <fieldset>
                    <legend>Preencha o formulário abaixo:</legend>

                    <div> 
                        <label for="Nome">Nome:</label>
                        <input type="text" id="Nome" name="Nome">
                    </div>

                    <div>
                        <label for="Email">Email:</label>
                        <input type="email" id="Email" name="Email" required> 
                    </div>

                    <div>
                        <label for="Assunto">Assunto:</label>
                        <input type="text" id="Assunto" name="Assunto">
                    </div>

                    <div>
                        <label for="Mensagem">Mensagem:</label>
                        <textarea name="Mensagem" id="Mensagem" rows="5"></textarea>
                    </div>
                </fieldset>

                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </form>
        </section>
    </main>
</body>
</html>
